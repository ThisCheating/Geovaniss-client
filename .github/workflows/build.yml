name: Compilar C++ a EXE

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Copiar repositorio
      uses: actions/checkout@v4

    - name: Configurar MinGW (g++)
      uses: egor-tukin/setup-mingw@v2

    - name: Compilar codigo fuente
      run: g++ main.cpp -o geovaniss.exe -O3 -static

    - name: Guardar el EXE como descarga (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: Geovaniss-Client-EXE
        path: geovaniss.exe